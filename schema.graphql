type StockToken {
  id: ID! # token contract address
  symbol: String!
  name: String!
  decimals: Int!
  transferCount: BigInt!
  totalVolume: BigInt!
  activeAccounts: Int!
  firstBlock: BigInt!
  lastBlock: BigInt!
}

type TokenFlow {
  id: ID! # <token address>-<account address>
  token: StockToken!
  account: String! @index
  # Net movement across the indexed window, not a wallet balance. Anything held
  # before the start block is invisible here, so this can be negative.
  netChange: BigInt!
  transferCount: BigInt!
}

type DailyTokenStat {
  id: ID! # <token address>-<day index>
  token: StockToken!
  day: Int! @index
  volume: BigInt!
  transfers: Int!
}
